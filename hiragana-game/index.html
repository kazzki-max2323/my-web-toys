<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#bfe6ff">
<title>ひらがな ぽんぽん</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #bfe6ff;
    --bg2: #fff1f8;
    --text: #5a3f7a;
    --accent: #ff7eb6;
    --panel: rgba(255, 255, 255, 0.82);
  }
  body.t-balloon { --bg1: #ffe9b8; --bg2: #ffd6e7; }
  body.t-star    { --bg1: #1d1f4f; --bg2: #4a3a8a; --text: #fff6c9; --panel: rgba(40, 36, 100, 0.85); }
  body.t-flower  { --bg1: #d9f7c9; --bg2: #ffe0ef; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; color: var(--text);
    background: linear-gradient(170deg, var(--bg1), var(--bg2)); background-attachment: fixed;
    font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic UI", sans-serif;
    font-weight: 700; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    touch-action: manipulation; overscroll-behavior: none;
  }
  body { transition: background 0.8s; }
  #fx { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 50; }

  /* background decorations */
  #deco { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  #deco span { position: absolute; bottom: -80px; border-radius: 50%; opacity: 0.45;
    background: radial-gradient(circle at 30% 30%, #fff, rgba(255,255,255,0.2) 60%, rgba(255,255,255,0));
    animation: rise linear infinite; }
  body.t-star #deco span { background: radial-gradient(circle, #fff9c4, rgba(255,249,196,0) 70%); opacity: 0.7; }
  @keyframes rise { to { transform: translateY(calc(-100vh - 160px)) translateX(30px); } }

  .screen { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; z-index: 1;
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom); }
  .screen.on { display: flex; }

  button { font: inherit; color: inherit; border: none; cursor: pointer; background: none; touch-action: manipulation; }
  .big-btn {
    font-size: 30px; padding: 16px 44px; border-radius: 999px; color: #fff; background: var(--accent);
    box-shadow: 0 6px 0 #d9548f, 0 10px 20px rgba(0,0,0,0.15); margin: 10px; letter-spacing: 0.1em;
    transition: transform 0.1s;
  }
  .big-btn:active { transform: translateY(5px); box-shadow: 0 1px 0 #d9548f; }
  .big-btn.sub { background: #8fc8ff; box-shadow: 0 6px 0 #5a9ad6, 0 10px 20px rgba(0,0,0,0.15); font-size: 24px; padding: 12px 32px; }
  .big-btn.sub:active { box-shadow: 0 1px 0 #5a9ad6; }

  /* title */
  #title { justify-content: center; text-align: center; }
  #title h1 { font-size: clamp(40px, 13vw, 72px); margin: 0 0 4px; line-height: 1.15; font-weight: 900;
    color: #fff; text-shadow: 0 4px 0 var(--accent), 0 8px 18px rgba(0,0,0,0.15); }
  #title h1 span { display: inline-block; animation: bob 2.4s ease-in-out infinite; }
  .mascot { font-size: 84px; animation: bob 2s ease-in-out infinite; display: inline-block; }
  .laps { font-size: 22px; margin: 6px 0 18px; min-height: 32px; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-12px) rotate(3deg); } }

  /* map */
  .topbar { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 10px 0; min-height: 64px; }
  .icon-btn { font-size: 30px; width: 56px; height: 56px; border-radius: 50%; background: var(--panel);
    box-shadow: 0 3px 8px rgba(0,0,0,0.1); display: grid; place-items: center; }
  .icon-btn:active { transform: scale(0.9); }
  .topbar .label { font-size: 22px; text-align: center; flex: 1; }
  #rows { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; width: 100%; max-width: 420px; margin: auto 0; padding-bottom: 20px; }
  .row-btn { aspect-ratio: 1; border-radius: 28px; background: var(--panel); font-size: clamp(40px, 13vw, 60px);
    box-shadow: 0 5px 0 rgba(0,0,0,0.08), 0 8px 16px rgba(0,0,0,0.08); position: relative; color: var(--text); }
  .row-btn:active { transform: scale(0.93); }
  .row-btn.done { background: #fff6b0; }
  body.t-star .row-btn.done { background: #6a5acd; }
  .row-btn .badge { position: absolute; right: -4px; top: -8px; font-size: 32px; }
  .row-btn.next { animation: wiggle 1.4s ease-in-out infinite; outline: 5px solid var(--accent); }
  @keyframes wiggle { 0%,100% { transform: rotate(0) scale(1); } 25% { transform: rotate(-6deg) scale(1.06); } 75% { transform: rotate(6deg) scale(1.06); } }

  /* play */
  #play { padding-left: 0; padding-right: 0; }
  #play .topbar { padding: 10px 16px; }
  #progress { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; flex: 1; padding: 0 6px; }
  #progress i { font-style: normal; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
    font-size: 18px; background: rgba(255,255,255,0.5); color: rgba(90,63,122,0.35); transition: all 0.3s; }
  body.t-star #progress i { background: rgba(255,255,255,0.12); color: rgba(255,246,201,0.4); }
  #progress i.got { background: #ffd84d; color: #7a4a00; transform: scale(1.15); }
  #stage { position: relative; flex: 1; width: 100%; overflow: hidden; }
  #stage.line { display: flex; align-items: center; justify-content: center; gap: 4px; padding: 0 8px; }

  .kana {
    --c: #ff9ec7;
    position: relative; width: var(--s); height: var(--s); border-radius: 50%; flex: none;
    display: grid; place-items: center; font-size: calc(var(--s) * 0.58); font-weight: 900; line-height: 1;
    color: #5a3f7a; touch-action: none;
  }
  #stage.float .kana { position: absolute; left: 0; top: 0; will-change: transform; }
  .kana b { position: relative; z-index: 2; pointer-events: none; display: block; }
  .kana .skin { position: absolute; inset: 0; border-radius: 50%; pointer-events: none; transition: transform 0.2s; }
  /* bubble theme */
  .t-bubble .kana .skin { background: radial-gradient(circle at 32% 28%, #fff 0 10%, rgba(255,255,255,0.55) 18%, color-mix(in srgb, var(--c) 35%, transparent) 60%, color-mix(in srgb, var(--c) 75%, white) 100%);
    box-shadow: inset 0 0 12px rgba(255,255,255,0.9), 0 4px 14px color-mix(in srgb, var(--c) 40%, transparent); border: 2px solid rgba(255,255,255,0.8); }
  /* balloon theme */
  .t-balloon .kana { color: #fff; }
  .t-balloon .kana b { text-shadow: 0 2px 0 rgba(0,0,0,0.18); top: -4%; }
  .t-balloon .kana .skin { border-radius: 50% 50% 48% 48% / 55% 55% 45% 45%;
    background: radial-gradient(circle at 35% 28%, rgba(255,255,255,0.75) 0 8%, var(--c) 30%, color-mix(in srgb, var(--c) 75%, black) 100%);
    box-shadow: 0 6px 14px rgba(0,0,0,0.15); }
  .t-balloon .kana .skin::after { content: ""; position: absolute; left: 50%; bottom: -26%; width: 2px; height: 28%; background: rgba(90,63,122,0.4); }
  .t-balloon .kana .skin::before { content: ""; position: absolute; left: calc(50% - 6px); bottom: -5%; border: 6px solid transparent; border-bottom-color: color-mix(in srgb, var(--c) 75%, black); }
  /* star theme */
  .t-star .kana { color: #2b2370; }
  .t-star .kana .skin { background: radial-gradient(circle at 40% 35%, #fffde8, #ffe46b 55%, #ffb63b);
    box-shadow: 0 0 22px #ffe46b, 0 0 50px rgba(255,228,107,0.5); }
  /* flower theme */
  .t-flower .kana .skin { background: #fffbe8; transform: scale(0.72);
    box-shadow: 0 calc(var(--s) * -0.3) 0 calc(var(--s) * -0.06) var(--c), 0 calc(var(--s) * 0.3) 0 calc(var(--s) * -0.06) var(--c),
      calc(var(--s) * -0.3) 0 0 calc(var(--s) * -0.06) var(--c), calc(var(--s) * 0.3) 0 0 calc(var(--s) * -0.06) var(--c),
      calc(var(--s) * 0.21) calc(var(--s) * 0.21) 0 calc(var(--s) * -0.06) var(--c), calc(var(--s) * -0.21) calc(var(--s) * 0.21) 0 calc(var(--s) * -0.06) var(--c),
      calc(var(--s) * 0.21) calc(var(--s) * -0.21) 0 calc(var(--s) * -0.06) var(--c), calc(var(--s) * -0.21) calc(var(--s) * -0.21) 0 calc(var(--s) * -0.06) var(--c); }

  .kana.enter > * { animation: drop 0.55s cubic-bezier(.3,1.6,.5,1) both; animation-delay: var(--d, 0s); }
  @keyframes drop { from { transform: translateY(-120px) scale(0.3); opacity: 0; } }
  .kana.say .skin { scale: 1.22; }
  .kana.say b { animation: sayb 0.5s ease; }
  @keyframes sayb { 50% { transform: scale(1.35); } }
  .kana.hint::before { content: ""; position: absolute; inset: -14px; border-radius: 50%; border: 5px dashed #fff;
    animation: spin 3s linear infinite, pulse 1s ease-in-out infinite; z-index: 3; pointer-events: none; }
  @keyframes spin { to { rotate: 360deg; } }
  @keyframes pulse { 50% { opacity: 0.35; } }
  .kana.nope b, .kana.nope .skin { animation: shake 0.45s ease; }
  @keyframes shake { 20% { translate: -10px 0; } 40% { translate: 9px 0; } 60% { translate: -6px 0; } 80% { translate: 4px 0; } }
  .kana.popped { pointer-events: none; }
  .kana.popped b, .kana.popped .skin { animation: popout 0.45s ease-in forwards; }
  @keyframes popout { 0% { transform: scale(1); } 35% { transform: scale(1.45); opacity: 1; } 100% { transform: scale(0.1); opacity: 0; } }

  #finger { position: fixed; font-size: 52px; pointer-events: none; z-index: 40; display: none; animation: tap 0.9s ease-in-out infinite; }
  @keyframes tap { 50% { transform: translate(6px, 12px) scale(0.92); } }

  #bubbleMsg { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); font-size: clamp(34px, 10vw, 56px);
    font-weight: 900; color: #fff; text-shadow: 0 4px 0 var(--accent), 0 6px 18px rgba(0,0,0,0.2); white-space: nowrap;
    pointer-events: none; opacity: 0; z-index: 20; }
  #bubbleMsg.show { animation: msg 1.8s ease both; }
  @keyframes msg { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3); } 15% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
    25% { transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -80%) scale(1); } }

  /* modal */
  .modal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 30;
    background: rgba(60, 30, 90, 0.35); backdrop-filter: blur(3px); padding: 16px; }
  .modal.on { display: flex; }
  .card { background: var(--panel); border-radius: 32px; padding: 26px 22px; text-align: center; width: 100%; max-width: 380px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2); animation: cardin 0.5s cubic-bezier(.3,1.5,.5,1); }
  @keyframes cardin { from { transform: scale(0.5); opacity: 0; } }
  .card h2 { font-size: 34px; margin: 0 0 6px; }
  .card p { font-size: 20px; margin: 6px 0; }
  .sticker { font-size: 120px; display: inline-block; animation: stickerin 1s cubic-bezier(.3,1.5,.5,1) both, shine 2s 1s ease-in-out infinite; filter: drop-shadow(0 6px 8px rgba(0,0,0,0.2)); }
  @keyframes stickerin { from { transform: rotate(-540deg) scale(0); } }
  @keyframes shine { 50% { transform: scale(1.08) rotate(6deg); } }
  .stars { font-size: 34px; letter-spacing: 6px; }

  #book .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 10px; width: 100%; max-width: 460px;
    overflow-y: auto; padding: 4px 0 24px; }
  #book .cell { aspect-ratio: 1; border-radius: 18px; background: var(--panel); display: grid; place-items: center; font-size: 40px; position: relative; }
  #book .cell.none { font-size: 26px; opacity: 0.45; }
  #book .cell small { position: absolute; right: 4px; bottom: 2px; font-size: 13px; }
  #book .count { font-size: 20px; margin-bottom: 10px; }
</style>
</head>
<body class="t-bubble">
<div id="deco"></div>
<canvas id="fx"></canvas>
<div id="finger">👆</div>

<section class="screen on" id="title">
  <div class="mascot">🐰</div>
  <h1><span>ひらがな</span><br><span style="animation-delay:-1.2s">ぽんぽん</span></h1>
  <div class="laps" id="titleLaps"></div>
  <button class="big-btn" id="startBtn">あそぶ</button>
  <button class="big-btn sub" id="bookBtn1">📖 シール</button>
</section>

<section class="screen" id="map">
  <div class="topbar">
    <button class="icon-btn" id="mapHome">🏠</button>
    <div class="label" id="mapLabel"></div>
    <button class="icon-btn" id="bookBtn2">📖</button>
  </div>
  <div id="rows"></div>
</section>

<section class="screen" id="play">
  <div class="topbar">
    <button class="icon-btn" id="playBack">🏠</button>
    <div id="progress"></div>
    <button class="icon-btn" id="sayBtn">🔊</button>
  </div>
  <div id="stage"></div>
  <div id="bubbleMsg"></div>
</section>

<section class="screen" id="book">
  <div class="topbar">
    <button class="icon-btn" id="bookBack">⬅️</button>
    <div class="label">シールちょう</div>
    <div style="width:56px"></div>
  </div>
  <div class="count" id="bookCount"></div>
  <div class="grid" id="bookGrid"></div>
</section>

<div class="modal" id="clearModal">
  <div class="card">
    <h2 id="clearTitle">やったね！</h2>
    <div class="stars">⭐⭐⭐</div>
    <div class="sticker" id="clearSticker">🐶</div>
    <p id="clearText">シール ゲット！</p>
    <button class="big-btn" id="clearNext">つぎへ ▶</button>
  </div>
</div>

<div class="modal" id="lapModal">
  <div class="card">
    <h2>ぜんぶ できたね！</h2>
    <div class="sticker">👑</div>
    <p id="lapText"></p>
    <button class="big-btn" id="lapNext">もういっかい ▶</button>
  </div>
</div>

<script src="voices/v0.js"></script>
<script>
// ---- data ----
const ROWS = [
  ['あ','い','う','え','お'], ['か','き','く','け','こ'], ['さ','し','す','せ','そ'],
  ['た','ち','つ','て','と'], ['な','に','ぬ','ね','の'], ['は','ひ','ふ','へ','ほ'],
  ['ま','み','む','め','も'], ['や','ゆ','よ'], ['ら','り','る','れ','ろ'], ['わ','を','ん'],
];
// lap n uses THEMES[n % 4]
const THEMES = [
  { cls: 't-bubble', name: 'しゃぼんだま', mascot: '🐰' },
  { cls: 't-balloon', name: 'ふうせん', mascot: '🐻' },
  { cls: 't-star', name: 'おほしさま', mascot: '🦉' },
  { cls: 't-flower', name: 'おはな', mascot: '🐝' },
];
const COLORS = ['#ff8fbf', '#ffb35c', '#ffd84d', '#7fdc8a', '#6ec8ff', '#b28dff', '#ff7a7a', '#4fd6c4'];
const STICKERS = ['🐶','🐱','🐰','🐻','🐼','🐨','🐯','🦁','🐮','🐷','🐸','🐵','🐔','🐧','🐤','🦄','🐬','🐳','🐙','🦋',
  '🐞','🐢','🦖','🐝','🦊','🐹','🦔','🐿️','🍓','🍒','🍑','🍰','🍩','🍭','🌈','🌻','🌷','🎀','🧸','🚂'];
const CHEERS = ['じょうず！', 'すごい！', 'いいね！', 'ぴったり！', 'できた！'];

const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const wait = ms => new Promise(r => setTimeout(r, ms));

// ---- save ----
const SAVE_KEY = 'hiragana-ponpon';
let save = { lap: 0, cleared: [], stickers: {} };
try { Object.assign(save, JSON.parse(localStorage.getItem(SAVE_KEY)) || {}); } catch {}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch {} }
const theme = () => THEMES[save.lap % THEMES.length];

// ---- sound (WebAudio, synthesized) ----
let ac = null;
function audio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; } }
  if (ac.state === 'suspended') ac.resume();
  // iOS: play through the silent switch like a media app
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch {}
  return ac;
}
function tone(freq, dur, { type = 'sine', vol = 0.25, at = 0, to = null, attack = 0.005 } = {}) {
  const a = audio(); if (!a) return;
  const t = a.currentTime + at;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination);
  o.start(t); o.stop(t + dur + 0.05);
}
// major pentatonic, so any run of pops sounds like a little melody
const SCALE = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.5, 1568, 1760];
const sfx = {
  pop(step) {
    tone(320, 0.09, { to: 1400, vol: 0.35 });                       // the "ぽん"
    const f = SCALE[Math.min(step, SCALE.length - 1)];
    tone(f, 0.35, { type: 'triangle', vol: 0.22, at: 0.04 });
    tone(f * 2, 0.25, { vol: 0.08, at: 0.06 });
  },
  nope() { tone(260, 0.18, { to: 180, vol: 0.18, type: 'sine' }); tone(200, 0.2, { to: 150, vol: 0.12, at: 0.12 }); },
  tick() { tone(1200, 0.06, { vol: 0.08, type: 'triangle' }); },
  whoosh() { tone(300, 0.4, { to: 900, vol: 0.12, type: 'sine', attack: 0.1 }); },
  fanfare() {
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, 0.3, { type: 'triangle', vol: 0.25, at: i * 0.12 }));
    [1046.5, 1318.5, 1568].forEach(f => tone(f, 0.9, { type: 'triangle', vol: 0.12, at: 0.5 }));
    for (let i = 0; i < 8; i++) tone(rand(1800, 3200), 0.15, { vol: 0.05, at: 0.6 + i * 0.07 });
  },
  sparkle() { for (let i = 0; i < 6; i++) tone(rand(1500, 3000), 0.18, { vol: 0.06, at: i * 0.06 }); },
};

// ---- voice ----
// Recorded clips from voices/*.js play through WebAudio, so the voice works even where the
// browser has no speech engine (in-app browsers, Android WebView). speechSynthesis is only
// a fallback for a clip that is missing or failed to decode.
// Ten voice packs; each row is read by a randomly picked one. v0 ships with the page, the rest
// load in the background after the first tap.
const VOICE_IDS = ['v0', 'v1', 'v2', 'v3', 'v4', 'v5', 'v6', 'v7', 'v8', 'v9'];
const VOICE_TEXT = { title: 'ひらがな、ぽんぽん！', float: 'こんどは、ふわふわ、だよ' };
const voiceBufs = {};   // pack id -> { key: Promise<AudioBuffer|null> }
let voiceId = 'v0', voiceSrc = null, voiceToken = 0;
function decodePack(id) {
  const a = audio(), pack = window.VOICE_PACKS?.[id];
  if (!a || !pack || voiceBufs[id]) return;
  voiceBufs[id] = {};
  for (const [key, b64] of Object.entries(pack)) {
    const bin = atob(b64), buf = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
    voiceBufs[id][key] = a.decodeAudioData(buf.buffer).catch(() => null);
  }
}
function loadAllPacks() {
  if (loadAllPacks.started) return;
  loadAllPacks.started = true;
  // one at a time, so the first rows are not slowed down by ten parallel downloads
  const todo = VOICE_IDS.filter(id => !window.VOICE_PACKS?.[id]);
  const next = () => {
    const id = todo.shift(); if (!id) return;
    const sc = document.createElement('script');
    sc.src = `voices/${id}.js`; sc.onload = sc.onerror = next;
    document.head.appendChild(sc);
  };
  next();
}
function pickVoice() {
  const ready = VOICE_IDS.filter(id => window.VOICE_PACKS?.[id] && id !== voiceId);
  if (ready.length) voiceId = pick(ready);
  decodePack(voiceId);
}
function stopVoice() {
  voiceToken++;
  if (voiceSrc) { try { voiceSrc.stop(); } catch {} voiceSrc = null; }
  synth?.cancel();
}
function playClip(key, tok) {
  decodePack(voiceId);
  return Promise.resolve(voiceBufs[voiceId]?.[key]).then(buf => {
    if (tok !== voiceToken) return;
    if (!buf) return speak(VOICE_TEXT[key] || key.replace(/^(row|lap):/, ''));
    return new Promise(resolve => {
      const src = ac.createBufferSource(), g = ac.createGain();
      g.gain.value = 1.4;
      src.buffer = buf; src.connect(g).connect(ac.destination);
      src.onended = resolve;
      setTimeout(resolve, buf.duration * 1000 + 400);   // in case onended never fires
      voiceSrc = src; src.start();
    });
  });
}
// say('あ') or say(['あ', 'float']): plays clips in order, cutting off whatever was playing
async function say(keys) {
  audio(); loadAllPacks();
  stopVoice();
  const tok = voiceToken;
  for (const k of [].concat(keys)) {
    if (tok !== voiceToken) return;
    await playClip(k, tok);
  }
}

const synth = window.speechSynthesis;
let jaVoice = null;
function loadVoices() {
  if (!synth) return;
  const vs = synth.getVoices().filter(v => /^ja/i.test(v.lang));
  jaVoice = vs.find(v => /kyoko|o-ren|nanami|google/i.test(v.name)) || vs[0] || null;
}
if (synth) { loadVoices(); synth.addEventListener?.('voiceschanged', loadVoices); }
// resolves when the utterance ends, or after a fallback timeout if the engine never reports back
function speak(text, { rate = 0.85 } = {}) {
  return new Promise(resolve => {
    const fallback = setTimeout(resolve, 700 + text.length * 260);
    if (!synth) return;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP'; if (jaVoice) u.voice = jaVoice;
    u.rate = rate; u.pitch = 1.25;
    u.onend = u.onerror = () => { clearTimeout(fallback); resolve(); };
    synth.speak(u);
  });
}

// ---- particles ----
const cv = $('fx'), ctx = cv.getContext('2d');
let W, H, parts = [];
function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resize); resize();

function burst(x, y, color, n = 22) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = rand(150, 420);
    parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(0.5, 0.9), t: 0, r: rand(4, 9),
      color: Math.random() < 0.3 ? '#fff' : color, shape: Math.random() < 0.5 ? 'star' : 'dot', g: 300, rot: rand(0, 6) });
  }
  parts.push({ x, y, ring: true, t: 0, life: 0.45, color });
}
function confetti(n = 120) {
  for (let i = 0; i < n; i++) {
    parts.push({ x: rand(0, W), y: rand(-H * 0.6, -10), vx: rand(-40, 40), vy: rand(120, 260), life: 4, t: 0,
      r: rand(5, 9), color: pick(COLORS), shape: 'rect', g: 30, rot: rand(0, 6), vr: rand(-6, 6) });
  }
}
function star(x, y, r, rot) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = rot + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;
    ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  ctx.closePath(); ctx.fill();
}
function drawFx(dt) {
  ctx.clearRect(0, 0, W, H);
  parts = parts.filter(p => (p.t += dt) < p.life);
  for (const p of parts) {
    const k = 1 - p.t / p.life;
    if (p.ring) {
      ctx.globalAlpha = k; ctx.strokeStyle = p.color; ctx.lineWidth = 6 * k;
      ctx.beginPath(); ctx.arc(p.x, p.y, 20 + (1 - k) * 90, 0, Math.PI * 2); ctx.stroke();
      continue;
    }
    p.vy += p.g * dt; p.vx *= 0.985;
    p.x += p.vx * dt; p.y += p.vy * dt; p.rot += (p.vr || 3) * dt;
    ctx.globalAlpha = Math.min(1, k * 1.6); ctx.fillStyle = p.color;
    if (p.shape === 'star') star(p.x, p.y, p.r * 1.4, p.rot);
    else if (p.shape === 'rect') { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); ctx.restore(); }
    else { ctx.beginPath(); ctx.arc(p.x, p.y, p.r * k + 1, 0, Math.PI * 2); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
}

// ---- screens ----
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id));
  hideFinger();
}
function applyTheme() {
  const t = theme();
  document.body.className = t.cls;
  document.querySelector('#title .mascot').textContent = t.mascot;
  const crowns = save.lap ? '👑'.repeat(Math.min(save.lap, 5)) + (save.lap > 5 ? '×' + save.lap : '') : '';
  $('titleLaps').textContent = crowns ? `${crowns}  ${save.lap + 1}しゅうめ` : '';
}
function buildDeco() {
  const d = $('deco'); d.innerHTML = '';
  for (let i = 0; i < 14; i++) {
    const s = document.createElement('span'), size = rand(16, 70);
    Object.assign(s.style, { left: rand(0, 100) + '%', width: size + 'px', height: size + 'px',
      animationDuration: rand(10, 22) + 's', animationDelay: -rand(0, 22) + 's' });
    d.appendChild(s);
  }
}

function nextRowIndex() {
  const i = ROWS.findIndex((_, k) => !save.cleared.includes(k));
  return i < 0 ? 0 : i;
}
function openMap() {
  applyTheme();
  $('mapLabel').textContent = `${theme().mascot} ${save.lap + 1}しゅうめ`;
  const box = $('rows'); box.innerHTML = '';
  const nxt = nextRowIndex();
  ROWS.forEach((row, i) => {
    const b = document.createElement('button');
    b.className = 'row-btn' + (save.cleared.includes(i) ? ' done' : '') + (i === nxt ? ' next' : '');
    b.textContent = row[0];
    if (save.cleared.includes(i)) b.insertAdjacentHTML('beforeend', '<span class="badge">⭐</span>');
    b.addEventListener('click', () => { sfx.tick(); startRow(i); });
    box.appendChild(b);
  });
  show('map');
}
function openBook(from) {
  const got = Object.keys(save.stickers).length;
  $('bookCount').textContent = `${got} / ${STICKERS.length} まい`;
  $('bookGrid').innerHTML = STICKERS.map(s => save.stickers[s]
    ? `<div class="cell">${s}${save.stickers[s] > 1 ? `<small>×${save.stickers[s]}</small>` : ''}</div>`
    : '<div class="cell none">？</div>').join('');
  $('bookBack').onclick = () => { sfx.tick(); from === 'map' ? openMap() : show('title'); };
  show('book');
}

// ---- game ----
const stage = $('stage');
let game = null;   // { row, rowIdx, phase, next, items, busy, idleTimer, combo }
let floatRAF = 0;

function kanaSize(n, phase) {
  const w = stage.clientWidth || innerWidth;
  if (phase === 1) return Math.min(110, (w - 16 - (n - 1) * 4) / n);
  return Math.min(120, w * 0.24);
}
function buildProgress() {
  $('progress').innerHTML = game.row.map(k => `<i>${k}</i>`).join('');
}
function markProgress(i, on) {
  const el = $('progress').children[i];
  if (el) el.classList.toggle('got', on);
}

function makeItem(k, i, size) {
  const el = document.createElement('div');
  el.className = 'kana enter';
  el.style.setProperty('--s', size + 'px');
  el.style.setProperty('--c', COLORS[(game.rowIdx * 2 + i) % COLORS.length]);
  el.innerHTML = `<span class="skin"></span><b>${k}</b>`;
  el.style.setProperty('--d', (i * 0.09) + 's');
  const item = { el, k, i, size, done: false };
  el.addEventListener('pointerdown', e => { e.preventDefault(); onTap(item); });
  return item;
}

function startRow(i) {
  pickVoice();
  stopFloat();
  game = { row: ROWS[i], rowIdx: i, phase: 1, next: 0, items: [], busy: true, combo: 0, idleTimer: 0, token: {} };
  show('play');
  buildProgress();
  phaseLine();
}

async function phaseLine() {
  const g = game, tok = g.token;
  stage.className = 'line'; stage.innerHTML = '';
  g.phase = 1; g.next = 0; g.busy = true;
  const size = kanaSize(g.row.length, 1);
  g.items = g.row.map((k, i) => makeItem(k, i, size));
  g.items.forEach(it => stage.appendChild(it.el));
  sfx.whoosh();
  await wait(700 + g.row.length * 90);
  // read the row aloud, lighting up each one as it is spoken
  for (const it of g.items) {
    if (tok !== game?.token) return;
    it.el.classList.remove('enter');
    it.el.classList.add('say'); sfx.tick();
    await say(it.k);
    it.el.classList.remove('say');
    await wait(120);
  }
  if (tok !== game?.token) return;
  await wait(250);
  g.busy = false;
  armIdle(save.lap === 0 && g.rowIdx === 0 ? 1200 : 5000);
}

async function phaseFloat() {
  const g = game, tok = g.token;
  g.phase = 2; g.next = 0; g.busy = true; g.combo = 0;
  g.row.forEach((_, i) => markProgress(i, false));
  stage.className = 'float'; stage.innerHTML = '';
  flash('こんどは ふわふわ！');
  sfx.whoosh();
  say('float');
  await wait(900);
  if (tok !== game?.token) return;
  const size = kanaSize(g.row.length, 2);
  const W2 = stage.clientWidth, H2 = stage.clientHeight;
  // speed grows a little every lap so repeat runs feel fresh
  const speed = 28 + Math.min(save.lap, 5) * 9;
  // drop items into a shuffled grid so they start apart, then let them drift
  const cols = 2, rows = Math.ceil(g.row.length / cols) + 1;
  const cells = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) cells.push([c, r]);
  cells.sort(() => Math.random() - 0.5);
  g.items = g.row.map((k, i) => {
    const it = makeItem(k, i, size);
    const [c, r] = cells[i];
    it.x = (c + 0.5) * W2 / cols - size / 2 + rand(-20, 20);
    it.y = (r + 0.5) * H2 / rows - size / 2 + rand(-15, 15);
    const a = rand(0, Math.PI * 2);
    it.vx = Math.cos(a) * speed; it.vy = Math.sin(a) * speed;
    it.ph = rand(0, 6);
    it.el.style.transform = `translate(${it.x}px, ${it.y}px)`;
    stage.appendChild(it.el);
    return it;
  });
  startFloat(speed);
  await wait(700);
  if (tok !== game?.token) return;
  g.items.forEach(it => it.el.classList.remove('enter'));
  g.busy = false;
  armIdle(5000);
}

function startFloat(speed) {
  let last = performance.now();
  const step = now => {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (!game) return;
    const W2 = stage.clientWidth, H2 = stage.clientHeight;
    const live = game.items.filter(it => !it.done);
    for (const a of live) {
      // gentle push apart so letters never hide each other
      for (const b of live) {
        if (a === b) continue;
        const dx = a.x - b.x, dy = a.y - b.y, d = Math.hypot(dx, dy) || 1, min = (a.size + b.size) / 2 + 8;
        if (d < min) { a.vx += dx / d * 60 * dt * 4; a.vy += dy / d * 60 * dt * 4; }
      }
      const v = Math.hypot(a.vx, a.vy) || 1;
      a.vx = a.vx / v * speed; a.vy = a.vy / v * speed;
      a.x += a.vx * dt; a.y += a.vy * dt; a.ph += dt * 2;
      if (a.x < 0) { a.x = 0; a.vx = Math.abs(a.vx); }
      if (a.x > W2 - a.size) { a.x = W2 - a.size; a.vx = -Math.abs(a.vx); }
      if (a.y < 0) { a.y = 0; a.vy = Math.abs(a.vy); }
      if (a.y > H2 - a.size - 20) { a.y = H2 - a.size - 20; a.vy = -Math.abs(a.vy); }
      a.el.style.transform = `translate(${a.x}px, ${a.y + Math.sin(a.ph) * 8}px) rotate(${Math.sin(a.ph * 0.7) * 8}deg)`;
    }
    if (live.length) floatRAF = requestAnimationFrame(step);
  };
  floatRAF = requestAnimationFrame(step);
}
function stopFloat() { cancelAnimationFrame(floatRAF); floatRAF = 0; }

function armIdle(ms) {
  clearTimeout(game.idleTimer); hideFinger();
  game.items.forEach(it => it.el.classList.remove('hint'));
  const tok = game.token;
  game.idleTimer = setTimeout(() => { if (tok === game?.token) giveHint(); }, ms);
}
function giveHint() {
  const it = game.items[game.next];
  if (!it || it.done) return;
  it.el.classList.add('hint');
  showFinger(it.el);
  say(it.k);
  armIdleRepeat();
}
function armIdleRepeat() {
  const tok = game.token;
  clearTimeout(game.idleTimer);
  game.idleTimer = setTimeout(() => { if (tok === game?.token) giveHint(); }, 7000);
}

let fingerEl = null, fingerRAF = 0;
function showFinger(el) {
  fingerEl = el; $('finger').style.display = 'block';
  const follow = () => {
    if (!fingerEl) return;
    const r = fingerEl.getBoundingClientRect();
    $('finger').style.left = (r.left + r.width * 0.45) + 'px';
    $('finger').style.top = (r.top + r.height * 0.55) + 'px';
    fingerRAF = requestAnimationFrame(follow);
  };
  cancelAnimationFrame(fingerRAF); follow();
}
function hideFinger() { fingerEl = null; cancelAnimationFrame(fingerRAF); $('finger').style.display = 'none'; }

function onTap(it) {
  audio();
  const g = game;
  if (!g || g.busy || it.done) return;
  if (it.i !== g.next) {
    it.el.classList.remove('nope'); void it.el.offsetWidth; it.el.classList.add('nope');
    sfx.nope();
    g.combo = 0;
    return;
  }
  it.done = true;
  const r = it.el.getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2, getComputedStyle(it.el).getPropertyValue('--c').trim() || '#ff8fbf');
  sfx.pop(g.next + (g.phase === 2 ? 3 : 0));
  say(it.k);
  it.el.classList.remove('hint', 'say', 'nope');
  it.el.classList.add('popped');
  if (navigator.vibrate) try { navigator.vibrate(18); } catch {}
  markProgress(it.i, true);
  g.next++;
  if (g.next >= g.row.length) {
    g.busy = true; clearTimeout(g.idleTimer); hideFinger();
    const tok = g.token;
    setTimeout(() => { if (tok === game?.token) phaseDone(); }, 800);
  } else {
    armIdle(5000);
  }
}

async function phaseDone() {
  const g = game, tok = g.token;
  if (g.phase === 1) {
    const cheer = pick(CHEERS);
    flash(cheer); say(cheer); sfx.sparkle();
    await wait(1300);
    if (tok === game?.token) phaseFloat();
  } else {
    stopFloat();
    rowClear();
  }
}

function flash(text) {
  const m = $('bubbleMsg');
  m.textContent = text; m.classList.remove('show'); void m.offsetWidth; m.classList.add('show');
}

function rowClear() {
  const g = game;
  sfx.fanfare(); confetti();
  if (!save.cleared.includes(g.rowIdx)) save.cleared.push(g.rowIdx);
  // prefer a sticker she doesn't have yet; once the book is full, hand out repeats
  const missing = STICKERS.filter(s => !save.stickers[s]);
  const s = pick(missing.length ? missing : STICKERS);
  const isNew = !save.stickers[s];
  save.stickers[s] = (save.stickers[s] || 0) + 1;
  persist();
  $('clearTitle').textContent = pick(['やったね！', 'すごーい！', 'はなまる！']);
  $('clearSticker').textContent = s;
  $('clearText').textContent = isNew ? 'あたらしい シール ゲット！' : 'シール もう1まい！';
  $('clearModal').classList.add('on');
  say('row:' + g.row[0]);
}

$('clearNext').addEventListener('click', () => {
  sfx.tick();
  $('clearModal').classList.remove('on');
  game = null;
  if (save.cleared.length >= ROWS.length) lapClear();
  else openMap();
});

function lapClear() {
  save.lap++; save.cleared = [];
  persist();
  const t = theme();
  $('lapText').innerHTML = `おうかん ゲット！<br>つぎは「${t.name}」だよ ${t.mascot}`;
  $('lapModal').classList.add('on');
  sfx.fanfare(); confetti(200);
  setTimeout(() => { sfx.fanfare(); confetti(120); }, 1400);
  say('lap:' + t.name);
}
$('lapNext').addEventListener('click', () => {
  sfx.tick();
  $('lapModal').classList.remove('on');
  openMap();
});

$('sayBtn').addEventListener('click', () => {
  if (!game || game.busy) return;
  sfx.tick();
  if (game.phase === 1 && game.next === 0) {
    // replay the whole row
    game.busy = true;
    const tok = game.token;
    (async () => {
      for (const it of game.items) {
        if (tok !== game?.token) return;
        it.el.classList.add('say'); await say(it.k); it.el.classList.remove('say'); await wait(120);
      }
      if (tok === game?.token) { game.busy = false; armIdle(5000); }
    })();
  } else giveHint();
});

function leavePlay() {
  sfx.tick(); stopFloat();
  if (game) clearTimeout(game.idleTimer);
  game = null; stopVoice();
  openMap();
}
$('playBack').addEventListener('click', leavePlay);

$('startBtn').addEventListener('click', () => {
  audio(); sfx.sparkle();
  say('title');   // first sound must come from a tap on iOS
  openMap();
});
$('mapHome').addEventListener('click', () => { sfx.tick(); applyTheme(); show('title'); });
$('bookBtn1').addEventListener('click', () => { audio(); sfx.tick(); openBook('title'); });
$('bookBtn2').addEventListener('click', () => { sfx.tick(); openBook('map'); });
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('visibilitychange', () => { if (document.hidden) stopVoice(); });

// ---- loop ----
let lastT = performance.now();
(function frame(now) {
  drawFx(Math.min(0.05, (now - lastT) / 1000)); lastT = now;
  requestAnimationFrame(frame);
})(lastT);

applyTheme();
buildDeco();
</script>
</body>
</html>
