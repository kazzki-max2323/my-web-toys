<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="影法師の夜">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>影法師の夜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --text: #f1f0ea;
    --muted: #9aa3bd;
    --accent: #e8c26a;
    --blood: #c4162f;
    --sil: #2c4f9e;
    --panel: rgba(9, 11, 20, 0.95);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--text); overflow: hidden;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  body { font-family: "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif; }
  button { font-family: inherit; }
  #app { position: fixed; inset: 0; overflow: hidden; touch-action: manipulation; }
  .bg { position: absolute; inset: 0; transition: opacity 1.4s ease; }
  #fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #deco { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 42%; pointer-events: none; transition: opacity 1.4s; }
  #stage { position: absolute; left: 0; right: 0; bottom: 0; height: 66%; display: flex; justify-content: center;
    align-items: flex-end; gap: 1.5%; pointer-events: none; }
  .sil { opacity: 0; transform: translateY(14px); transition: opacity .7s, transform .7s;
    filter: drop-shadow(0 0 10px rgba(80, 130, 255, .35)); }
  .sil.on { opacity: .6; transform: none; }
  .sil.talk { opacity: .95; }
  .sil svg { display: block; width: 100%; height: auto; }
  .sil .b { fill: var(--sil); transition: fill 1.2s; }
  .sil.red { opacity: 1; filter: drop-shadow(0 0 16px rgba(255, 40, 60, .65)); }
  .sil.red .b { fill: var(--blood); }
  #scrim { position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(rgba(0,0,0,.62), rgba(0,0,0,.3) 45%, rgba(0,0,0,.58)); }
  #flash { position: absolute; inset: 0; pointer-events: none; opacity: 0; }
  #flash.red { animation: redf 1.8s ease-out; }
  #flash.white { animation: whitef .9s ease-out; }
  @keyframes redf { 0% { opacity: .85; background: #b0001a; } 100% { opacity: 0; background: #b0001a; } }
  @keyframes whitef { 0% { opacity: .7; background: #dfe8ff; } 100% { opacity: 0; background: #dfe8ff; } }

  #top { position: absolute; left: 0; right: 0; top: 0; z-index: 5; display: flex; align-items: center; gap: 6px;
    padding: calc(env(safe-area-inset-top) + 8px) 10px 6px 16px; font-family: system-ui, sans-serif; }
  #place { flex: 1; min-width: 0; font-size: 13px; color: var(--muted); letter-spacing: .08em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #place b { color: var(--accent); font-weight: 600; margin-left: 6px; }
  .ib { width: 38px; height: 38px; border-radius: 10px; border: 1px solid rgba(255,255,255,.16);
    background: rgba(10,12,24,.55); color: var(--text); font-size: 17px; cursor: pointer; padding: 0; }
  .ib.on { border-color: var(--accent); background: rgba(232,194,106,.2); }
  .ib[hidden] { display: none; }

  #text { position: absolute; left: 0; right: 0; z-index: 3;
    top: calc(env(safe-area-inset-top) + 52px); bottom: calc(env(safe-area-inset-bottom) + 12px);
    overflow-y: auto; padding: 4px max(20px, calc(50% - 330px)) 28px;
    font-size: clamp(16px, 4.4vw, 19px); line-height: 2;
    text-shadow: 0 1px 3px #000, 0 0 14px rgba(0,0,0,.95); }
  #text p { margin: 0 0 .7em; }
  #text p.center { text-align: center; }
  .nm { display: block; font-size: .78em; color: var(--accent); letter-spacing: .12em; line-height: 1.5; }
  .cur { display: inline-block; margin-left: .3em; color: var(--accent); font-size: .75em; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .choices { display: grid; gap: 8px; margin: 14px 0 8px; }
  .choices.two { grid-template-columns: 1fr 1fr; }
  .choices h3 { grid-column: 1 / -1; margin: 8px 0 -2px; font: 400 12px system-ui, sans-serif; color: var(--muted); letter-spacing: .2em; text-shadow: none; }
  .ch { font-size: .9em; text-align: left; padding: 10px 14px; border-radius: 8px; line-height: 1.5; cursor: pointer;
    border: 1px solid rgba(255,255,255,.22); background: rgba(12,16,32,.78); color: var(--text); text-shadow: none; }
  .ch:hover, .ch:focus-visible { border-color: var(--accent); background: rgba(70,56,22,.8); outline: none; }
  .ch.done { color: var(--muted); }
  .ch.done::after { content: " ✓"; color: var(--accent); }
  .ch.danger { border-color: rgba(220,40,60,.75); }
  .ch.wide { grid-column: 1 / -1; }

  .ov { position: absolute; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
    padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px); }
  .ov[hidden] { display: none; }
  #title { flex-direction: column; text-align: center; background: radial-gradient(ellipse at 50% 35%, rgba(20,34,70,.35), rgba(0,0,0,.75) 75%); }
  #title h1 { font-size: clamp(38px, 12vw, 64px); letter-spacing: .25em; margin: 0 0 0 .25em; font-weight: 700;
    text-shadow: 0 0 24px rgba(80,130,255,.6), 0 2px 4px #000; }
  #title .sub { color: var(--muted); font-size: 14px; letter-spacing: .2em; margin: 10px 0 34px; }
  .bigbtn { display: block; width: min(300px, 100%); margin: 10px auto; padding: 14px 18px; font-size: 17px; letter-spacing: .1em;
    border-radius: 10px; border: 1px solid rgba(255,255,255,.28); background: rgba(10,14,30,.7); color: var(--text); cursor: pointer; }
  .bigbtn:hover, .bigbtn:focus-visible { border-color: var(--accent); background: rgba(70,56,22,.8); outline: none; }
  .bigbtn.main { border-color: var(--accent); }
  #title .rec { margin-top: 26px; font: 13px/1.8 system-ui, sans-serif; color: var(--muted); }
  #title .hp { margin-top: 6px; font: 12px system-ui, sans-serif; color: #6c7390; }

  #panel { background: rgba(0,0,0,.6); z-index: 12; }
  .pbox { width: min(560px, 100%); max-height: 100%; overflow-y: auto; background: var(--panel); border: 1px solid rgba(255,255,255,.14);
    border-radius: 14px; padding: 20px 18px 16px; font: 14px/1.75 system-ui, "Hiragino Sans", sans-serif; }
  .pbox h2 { font-family: "Noto Serif JP", serif; font-size: 20px; margin: 0 0 4px; letter-spacing: .1em; }
  .pbox h4 { margin: 18px 0 6px; font-size: 12px; color: var(--accent); letter-spacing: .2em; font-weight: 600; }
  .pbox ul { margin: 0; padding-left: 1.2em; }
  .pbox li { margin: 3px 0; }
  .pbox .muted { color: var(--muted); }
  .pbox .bigbtn { font-size: 15px; padding: 11px; }
  table.grid { border-collapse: collapse; width: 100%; font-size: 13px; }
  table.grid th, table.grid td { border-bottom: 1px solid rgba(255,255,255,.1); padding: 6px 4px; text-align: center; }
  table.grid th:first-child, table.grid td:first-child { text-align: left; }
  table.grid th { color: var(--muted); font-weight: 500; font-size: 11px; }
  .y { color: #ff8a9a; font-weight: 700; }
  .n { color: #6c7390; }
  .dead { color: #6c7390; text-decoration: line-through; }

  #ending { flex-direction: column; text-align: center; background: rgba(0,0,0,.72); }
  #ending .k { font-size: clamp(30px, 10vw, 52px); letter-spacing: .2em; margin: 0; }
  #ending .k.true { color: var(--accent); text-shadow: 0 0 22px rgba(232,194,106,.5); }
  #ending .k.normal { color: #b9c6dd; }
  #ending .k.bad { color: var(--blood); text-shadow: 0 0 22px rgba(255,30,50,.5); }
  #ending .t { font-size: 18px; letter-spacing: .15em; margin: 10px 0 30px; color: var(--text); }
</style>
</head>
<body>
<div id="app">
  <div class="bg" id="bgA"></div>
  <div class="bg" id="bgB" style="opacity:0"></div>
  <canvas id="fx"></canvas>
  <svg id="deco" viewBox="0 0 400 160" preserveAspectRatio="none"></svg>
  <div id="stage"></div>
  <div id="scrim"></div>
  <div id="flash"></div>
  <div id="text" aria-live="polite"></div>
  <div id="top">
    <div id="place"></div>
    <button class="ib" id="bNote" title="手帳" hidden>📓</button>
    <button class="ib" id="bSkip" title="早送り">⏩</button>
    <button class="ib" id="bSnd" title="音">🔊</button>
  </div>

  <div class="ov" id="title">
    <h1>影法師の夜</h1>
    <div class="sub">やるたびに 犯人が変わる サウンドノベル</div>
    <button class="bigbtn main" id="bStart">新しい事件をはじめる</button>
    <button class="bigbtn" id="bRec">これまでの記録</button>
    <div class="rec" id="recLine"></div>
    <div class="hp">🎧 音が出ます　／　画面をタップして読みすすめます</div>
  </div>
  <div class="ov" id="panel" hidden><div class="pbox" id="pbox"></div></div>
  <div class="ov" id="ending" hidden>
    <p class="k" id="endK"></p>
    <p class="t" id="endT"></p>
    <button class="bigbtn main" id="bTruth">事件の真相を見る</button>
    <button class="bigbtn" id="bAgain">新しい事件へ</button>
    <button class="bigbtn" id="bToTitle">タイトルへ</button>
  </div>
</div>

<script>
// ============================================================
//  乱数（事件番号から毎回ちがう事件を作る）
// ============================================================
let rnd = Math.random;
function seeded(a) {
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const pick = a => a[Math.floor(rnd() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const $ = s => document.querySelector(s);

// ============================================================
//  舞台
// ============================================================
const SETTINGS = [
  { id: 'snow', name: 'ペンション「白樺荘」', short: '白樺荘', amb: 'snow', wet: '雪', rel: '大学のサークル仲間',
    hostRole: () => 'オーナー',
    arrive: c => [`大学最後の冬休み。僕は${c}に誘われて、信州の山奥にあるペンション「白樺荘」へやってきた。`,

    isolate: h => ['夕食が終わるころ、窓の外の雪は、横なぐりの吹雪に変わっていた。',
      `${h}が受話器を置いて、首を振った。電話が通じない。ラジオによれば、ふもとへ下りる一本道が雪崩でふさがれたらしい。`,
      'つまり僕たちは、この白樺荘に閉じこめられたのだ。'],
    help: '吹雪もやみ、ふもとへ助けを呼びに行ける',
    dawn: ['夜が明けると、吹雪はうそのようにやんでいた。', '昼すぎ、除雪車のうなりとともに、警察がやってきた。'],
    flee: x => `翌朝、${x}の姿はどこにもなかった。雪の上に、森へと続く足跡だけが残っていた。`,
    home: '帰りのバス',
    locs: { lounge: 'ラウンジ', kitchen: '厨房', store: '地下の物置', outside: '裏の薪小屋', corridor: '二階の廊下' },
    spots: { lounge: '暖炉の灰の中', kitchen: '流しの下の戸棚', store: '古いスキー板の陰', outside: '積みあげた薪のすき間', corridor: '突きあたりの飾り棚' },
    weapons: ['ブロンズの置物', '暖炉の火かき棒', '重い燭台'],
    flavor: {
      lounge: ['暖炉の火は小さくなり、薪がときおりはぜる音だけが響いている。', '棚に古いボードゲームが並んでいる。ソファの下ものぞいてみたが、変わったところはない。'],
      kitchen: ['ステンレスの調理台は、きれいに片づいている。包丁も、全部そろっていた。', '大きな冷蔵庫が低くうなっている。中には明日の朝食の材料。それだけだ。'],
      store: ['裸電球の下に、スキー板やスノーシューが並んでいる。', '古い段ボール箱を開けてみたが、中身は季節外れのクリスマスの飾りだけだった。'],
      outside: ['吹雪が顔をたたく。薪小屋の屋根が、風にきしんでいる。', '薪が整然と積まれている。斧は、壁にきちんと掛けられたままだ。'],
      corridor: ['客室のドアが並ぶ、薄暗い廊下。どの部屋も、しんと静まりかえっている。', '窓の外は真っ白だ。吹雪の音が、壁ごしに低く響いている。'] } },
  { id: 'island', name: '孤島の洋館「鴉館」', short: '鴉館', amb: 'storm', wet: '雨', rel: '同じゼミの友人',
    hostRole: () => '館の主',
    arrive: c => [`${c}が懸賞で当てたのは、瀬戸内の小さな島に建つ洋館「鴉館（からすやかた）」への招待状だった。`,
      '定期船は週に一度だけ。桟橋に降りたつと、灰色の海を背に、黒い屋根の館がそびえていた。',
      '古い煉瓦の壁に、蔦が血管のようにからみついている。'],
    dinnerRoom: '食堂', dish: '魚介のスープと、館の地下で寝かせたという赤ワイン',
    isolate: h => ['夜になって、嵐が島をのみこんだ。窓ガラスが鳴り、遠くで雷が落ちる。',
      `${h}によれば、この天気では迎えの船は出せない。電話線も、どこかで切れてしまったらしい。`,
      '島には、僕たちしかいない。'],
    help: '嵐もおさまり、船を呼べる',
    dawn: ['夜明けとともに、嵐は去った。', '昼前、警察の船が桟橋に着いた。'],
    flee: x => `翌朝、${x}の姿はどこにもなかった。桟橋につないであったボートが、一艘だけ消えていた。`,
    home: '帰りの船',
    locs: { lounge: '大広間', kitchen: '厨房', store: '書庫', outside: '温室', corridor: '東の回廊' },
    spots: { lounge: '暖炉の灰の中', kitchen: '食器棚の奥', store: '古い百科事典のうしろ', outside: '枯れた鉢植えの土の中', corridor: '甲冑の置物の陰' },
    weapons: ['ブロンズの胸像', '鉄の燭台', 'ワインの瓶'],
    flavor: {
      lounge: ['大きな暖炉と、壁一面の肖像画。描かれた人びとの目が、こちらを見ているような気がする。', '長いソファがいくつも並んでいる。クッションの下まで探ったが、何もない。'],
      kitchen: ['よく磨かれた銅鍋が並んでいる。夕食の片づけは、きちんとすんでいるようだ。', '冷蔵庫のモーター音だけが、低くうなっている。'],
      store: ['天井まで届く本棚に、古い洋書がぎっしり詰まっている。', 'ほこりっぽい空気。誰かが最近ここに入った様子はない。'],
      outside: ['ガラスの天井を、雨が激しくたたいている。南国の植物の葉が、ぬるい空気のなかで揺れていた。', '鉢植えのあいだを探したが、見つかったのは古いじょうろだけだった。'],
      corridor: ['肖像画と甲冑がずらりと並ぶ、長い回廊。燭台の灯りが、すきま風に揺れている。', '窓の外で、稲妻が光った。一瞬、甲冑たちが動いたように見えた。'] } },
  { id: 'onsen', name: '山あいの温泉宿「霧ノ湯」', short: '霧ノ湯', amb: 'rain', wet: '雨', rel: '同じゼミの仲間',
    hostRole: c => c.sex === 'f' ? '女将' : '主人',
    arrive: c => [`ゼミの卒業旅行。${c}が見つけてきたのは、地図にもほとんど載っていない山あいの温泉宿「霧ノ湯」だった。`,
      'つり橋を渡り、杉林の石段をのぼる。霧の向こうから、湯けむりと古い木造の建物があらわれた。',
      '玄関の提灯が、風もないのに、ゆらりと揺れた。'],
    dinnerRoom: '大広間', dish: '山菜の天ぷらと、鮎の塩焼き',
    isolate: h => ['夕方から降りだした雨は、夜には滝のような大雨になった。',
      `来るときに渡ったつり橋が、増水で流された──${h}が青い顔で告げた。電話も、この雨で通じなくなっている。`,
      '僕たちは、この宿から出られない。'],
    help: '雨もおさまり、救助を呼べる',
    dawn: ['明け方、雨はようやく小降りになった。', '昼すぎ、救助のヘリコプターの音が、谷に響きわたった。'],
    flee: x => `翌朝、${x}の姿はどこにもなかった。ぬかるんだ山道に、谷へと下りていく足跡だけが残っていた。`,
    home: '帰りのヘリコプター',
    locs: { lounge: '囲炉裏の間', kitchen: '台所', store: '古い蔵', outside: '露天風呂', corridor: '離れへの渡り廊下' },
    spots: { lounge: '囲炉裏の灰の中', kitchen: 'かまどの裏', store: '古い長持ちの陰', outside: '湯船のわきの岩かげ', corridor: '廊下の床下' },
    weapons: ['鉄瓶', '石の文鎮', '重い燭台'],
    flavor: {
      lounge: ['囲炉裏の火が、ぱちりとはぜた。自在鉤に吊るされた鉄瓶から、湯気が細くのぼっている。', '古い柱時計が、こち、こちと時を刻んでいる。'],
      kitchen: ['土間に、大きなかまどがふたつ。夕食の残りの、だしの匂いがした。', '水がめの水面が、ろうそくの灯りを映して揺れている。'],
      store: ['ひんやりとした蔵のなかに、古い長持ちや掛け軸が積まれている。', 'ほこりの上に、新しい足跡はない。ここには誰も来ていないようだ。'],
      outside: ['雨に打たれる湯船から、白い湯けむりが立ちのぼっている。', '岩のあいだを探したが、見つかったのは誰かの忘れた手ぬぐいだけだった。'],
      corridor: ['軒から落ちる雨だれが、すだれのように廊下を包んでいる。', 'ぎし、ぎし、と床板が鳴る。誰かが歩いても、すぐにわかりそうだ。'] } },

// ============================================================
//  話し方（丁寧・男・女・年配）
// ============================================================
const ST = {
  pol: {
    alone: (I, t, a) => `「${t}ごろですか？ ${I}は自分の部屋で${a}いました。……ひとりでしたから、証明してくれる人はいませんけど」`,
    with: (I, t, P, pl, a) => `「${t}ごろなら、${P}さんと${pl}で${a}いました。${P}さんに聞いてもらえれば、わかります」`,
    withMe: (t, pl) => `「${t}ごろは、あなたと${pl}でお話ししていたじゃありませんか」`,
    react: '「そんな……どうして、こんなことに……」',
    protest: I => `「ち、ちがいます！ ${I}じゃありません！ 信じてください！」`,
    deny: '「……面白い推理ですね。でも、証拠はあるんですか？」',
    broken: '「……ふふ。完璧だと思っていたのに」',
    wet: '「ああ、これですか。眠れなくて、少し外の様子を見に出たんです」',
    cut: '「この絆創膏ですか？ 夕方、割れたグラスを片づけていて、切ってしまったんです」',
    comp: '「すてきなところですね。思いきって来てよかった」',
    fear: '「警察が来るまで……ここで待つしかないんですね」',
    kill: '「……あなたは、まちがえたんですよ」',

async function investigate() {
  G.investigating = true; $('#bNote').hidden = false;
  while (true) {
    if (G.t >= MAX_T) { await accuse(true); return; }
    if (G.t >= MURDER2_AT && !G.v2done) await secondMurder();
    cls(); scene('corridor', locName('corridor')); show([]); bgm('mystery');
    line(`時刻は${clock()}。夜明けまで、あと${leftTime()}。`);
    line(G.t === 0 ? 'どこから調べよう？' : pick(['次は、どうする？', '急がなければ。', '考えろ。犯人は、この中にいる。']));
    const items = [{ h: '調べる' }, { label: locName('room'), v: ['s', 'room'], cls: G.searched.room ? 'done' : '' }];
    for (const k of Object.keys(G.set.locs)) items.push({ label: locName(k), v: ['s', k], cls: G.searched[k] ? 'done' : '' });
    items.push({ h: '話を聞く' });
    for (const c of G.sus.filter(c => c.alive)) items.push({ label: N(c), v: ['t', c], cls: G.talked[c.id] ? 'done' : '' });
    items.push({ h: 'そのほか' });
    items.push({ label: '📓 手帳を見る', v: ['n'] });
    items.push({ label: '犯人を指名する', v: ['a'], cls: 'danger' });
    const [kind, arg] = await choose(items, true);
    if (kind === 's') await search(arg);
    else if (kind === 't') await talk(arg);
    else if (kind === 'n') await openNote();
    else if (kind === 'a') { if (await accuse(false)) return; }
  }
}

async function search(k) {
  const first = !G.searched[k];
  if (first) { G.searched[k] = true; G.t++; }
  cls(); scene(k === 'room' ? 'room' : k, locName(k)); show([]); setPlace(locName(k));
  if (!first) {
    line(`${locName(k)}は、もう調べた。`);
    const what = k === 'room' ? 'time' : G.clueAt[k];
    if (what === 'time') line(`腕時計は${G.tm}で止まっていた。`);
    else if (what === 'memo') line(`${N(G.herring)}の名前が書かれたメモを見つけた場所だ。`);
    else if (what) line(DIMS[what].note());
    else line('めぼしいものは、何もなかった。');
    await choose([{ label: 'もどる', v: 1 }]);
    return;
  }
  if (k === 'room') {
    await T(`${N(G.V)}の部屋。遺体には、誰かが毛布をかけていた。`);
    await T('椅子が倒れ、床には割れた花瓶の破片が散らばっている。争ったあとだ。');
    if ([G.d1, G.d2].includes('left')) await T('凶器らしいものは見当たらない。犯人が持ちさったのだろうか。');
    else await T(`ベッドの陰に、血のついた${G.weapon}が転がっていた。これが凶器だろう。`);
    if ([G.d1, G.d2].includes('tall')) await T(`そういえば、${N(G.V)}が夕食のときに見せびらかしていた革の財布が、どこにもない。`);
    if (G.timeVariant) {
      await T(`ふと、${N(G.V)}の腕時計に目がとまった。ガラスが割れ、針が止まっている。`);
      await T(`指しているのは──${G.tm}。倒れたときに、床に打ちつけたのだ。`);
    } else {
      await T('床に、小さな置き時計が落ちていた。もみあったときに、机から落ちたのだろう。電池のふたが外れて、針が止まっている。');
      await T(`指しているのは──${G.tm}。`);
    }
    sfx('clue');
    await T(`犯行時刻は、${G.tm}ごろ。まちがいない。`);
    G.found.time = true;
  } else {
    const what = G.clueAt[k], name = locName(k), sp = G.set.spots[k];
    if (G.v2done && k === G.v2loc) await T(`${N(G.V2)}が倒れていた場所だ。床には、まだそのあとが残っている。`);
    if (what === 'memo') {
      await T(`${name}の${sp}に、くしゃくしゃに丸めた紙切れが押しこまれていた。`);
      await T(`広げると、走り書きの文字。「今夜、話がある。部屋に行く ──${N(G.herring)}」`);
      sfx('clue');
      await T(`${N(G.herring)}が、${N(G.V)}を訪ねようとしていた……？`);
      G.found.memo = true;
    } else if (what) {
      const ls = DIMS[what].clue(name, sp);
      for (let i = 0; i < ls.length; i++) { if (i === ls.length - 1) sfx('clue'); await T(ls[i]); }
      G.found[what] = true;
    } else {
      const f = G.set.flavor[k];
      await T(f[0]); await T(f[1]);
      await T('ここには、手がかりはなさそうだ。');
    }
  }
}

async function talk(c) {
  const first = !G.talked[c.id];
  cls(); scene('lounge', L()); show([c], c);
  if (!first) {
    line(`${N(c)}には、もう話を聞いた。`);

    await choose([{ label: 'もどる', v: 1 }]);
    return;
  }
  G.talked[c.id] = true; G.t++;
  await T(pick([`${N(c)}に話を聞くことにした。`, `${N(c)}は${L()}の隅で、じっと何かを考えこんでいた。`, `${N(c)}は落ちつかない様子で、窓の外を見ていた。`]));
  await T(`${WINDOW}ごろ、どこで何をしていたのか──たずねてみる。`);
  const st = ST[c.st];
  if (c.alone) await S(c, st.alone(c.I, '11時から12時', c.act));
  else if (c.withMe) { await S(c, st.withMe('11時から12時', L())); talking(null); await T(`……そうだった。その時間、僕は${N(c)}とずっと一緒にいた。`); }
  else await S(c, st.with(c.I, '11時から12時', N(c.partner), L(), c.pact));
  learn(c, 'alibi'); if (c.partner) learn(c.partner, 'alibi');
  talking(null);
  for (const d of shuffle([G.d1, G.d2, G.d3])) {
    const D = DIMS[d];
    await T(c.tr[d] ? D.obsOn(N(c)) : D.obsOff(N(c)));
    learn(c, d);
    if (c.tr[d] && D.excuse) { await S(c, st[D.excuse]); talking(null); }

  if (c === G.herring && G.found.memo) await memoTalk(c);
}
async function memoTalk(c) {
  G.memoTalked = true;
  await T(`あのメモのことを切りだすと、${N(c)}の顔色が変わった。`);

}
function personFacts(c) {
  const out = [];
  if (knowAlibi(c)) out.push(c.alone ? 'アリバイ：ひとりで部屋にいた（証人なし）' : c.withMe ? 'アリバイ：僕と一緒にいた' : `アリバイ：${N(c.partner)}と${L()}にいた`);
  for (const d of [G.d1, G.d2, G.d3]) if (knowTrait(c, d)) out.push(c.tr[d] ? DIMS[d].on : DIMS[d].off);
  if (c === G.herring && G.memoTalked) out.push('メモを書いたことは認めた。部屋は訪ねたが、返事はなかったという');
  if (!out.length) out.push('まだ話を聞いていない');
  return out;
}

function loadRec() { try { return JSON.parse(localStorage.getItem('kagebo-rec')) || null; } catch (e) { return null; } }
function rec() { return Object.assign({ played: 0, true: 0, normal: 0, bad: 0, caught: [] }, loadRec() || {}); }
function saveRec(r) { try { localStorage.setItem('kagebo-rec', JSON.stringify(r)); } catch (e) {} }
let endWait = null;
function ending(kind, k, t) {
  const r = rec(); r.played++; r[kind]++;
  if (kind === 'true' && !r.caught.includes(G.X.id)) r.caught.push(G.X.id);
  saveRec(r);
  STATE = 'end';
  $('#endK').textContent = k; $('#endK').className = 'k ' + kind; $('#endT').textContent = `── ${t} ──`;
  $('#ending').hidden = false;
  return new Promise(res => { endWait = res; });
}
function truthHTML() {

  <h4>犯人</h4><p><b>${esc(X.name)}</b>（${esc(MOTIVES[G.motive].sum)}）</p>

    <li>${G.found.time ? '✅' : '⬜'} 止まった時計 → 犯行時刻は${G.tm}ごろ<br><span class="muted">${esc(locName('room'))}</span></li>
    ${clue(G.d1, wh(G.d1))}${clue(G.d2, wh(G.d2))}</ul>

}
function gridHTML(all) {
  const cols = [{ k: 'alibi', lab: 'アリバイなし', show: all || G.found.time }, { k: G.d1, lab: DIMS[G.d1].tag, show: all || G.found[G.d1] }, { k: G.d2, lab: DIMS[G.d2].tag, show: all || G.found[G.d2] }].filter(c => c.show);
  if (!cols.length) return '<p class="muted">決め手になりそうな手がかりは、まだ見つかっていない。</p>';
  const cell = (c, k) => {
    const known = all || (k === 'alibi' ? knowAlibi(c) : knowTrait(c, k));
    if (!known) return '<td class="n">？</td>';
    const v = k === 'alibi' ? c.alone : c.tr[k];
    return v ? '<td class="y">●</td>' : '<td class="n">—</td>';
  };
  let h = `<table class="grid"><tr><th>人物</th>${cols.map(c => `<th>${c.lab}</th>`).join('')}</tr>`;
  for (const c of G.sus) h += `<tr><td class="${c.alive ? '' : 'dead'}">${esc(N(c))}${all && c === G.X ? ' 🔪' : ''}</td>${cols.map(k => cell(c, k.k)).join('')}</tr>`;
  return h + '</table><p class="muted" style="font-size:12px;margin-top:6px">● = 手がかりにあてはまる　？ = まだ話を聞いていない</p>';
}
function noteHTML() {
  const clues = [];
  if (G.found.time) clues.push(`止まった時計 → 犯行時刻は${G.tm}ごろ`);
  for (const d of [G.d1, G.d2]) if (G.found[d]) clues.push(DIMS[d].note());
  if (G.found.memo) clues.push(`「今夜、話がある。部屋に行く ──${N(G.herring)}」と書かれたメモ`);
  const people = G.sus.map(c => `<li><b class="${c.alive ? '' : 'dead'}">${esc(N(c))}</b>${c.alive ? '' : '（死亡）'}　<span class="muted">${esc(personFacts(c).join(' ／ '))}</span></li>`).join('');
  return `<h2>📓 手帳</h2><div class="muted">${esc(G.set.name)}　${clock()}　夜明けまであと${leftTime()}</div>
  <h4>事件</h4><ul><li>${esc(N(G.V))}が自分の部屋で殺された（${esc(WINDOW)}ごろ）</li>${G.v2done ? `<li>停電のあと、${esc(N(G.V2))}が${esc(locName(G.v2loc))}で殺された</li>` : ''}</ul>
  <h4>手がかり</h4>${clues.length ? '<ul>' + clues.map(s => `<li>${esc(s)}</li>`).join('') + '</ul>' : '<p class="muted">まだ何も見つけていない。</p>'}
  <h4>推理メモ</h4>${gridHTML(false)}
  <h4>聞いた話</h4><ul>${people}</ul>
  <button class="bigbtn" data-close>とじる</button>`;
}
function openPanel(html) {
  $('#pbox').innerHTML = html; $('#panel').hidden = false; $('#pbox').scrollTop = 0;
  return new Promise(res => { $('#pbox').querySelector('[data-close]').onclick = () => { $('#panel').hidden = true; res(); }; });
}
const openNote = () => openPanel(noteHTML());
function recHTML() {
  const r = rec();
  const list = PEOPLE.map(p => r.caught.includes(p.id) ? `<li>${esc(p.name)}</li>` : '<li class="muted">？？？</li>').join('');
  return `<h2>これまでの記録</h2>
  <ul><li>遊んだ事件：${r.played}</li><li>TRUE END：${r.true}</li><li>NORMAL END：${r.normal}</li><li>BAD END：${r.bad}</li></ul>
  <h4>つかまえた犯人（${r.caught.length} / ${PEOPLE.length}）</h4><ul>${list}</ul>
  <button class="bigbtn" data-close>とじる</button>`;
}

// ============================================================
//  タイトルと画面の切りかえ
// ============================================================
let STATE = 'title';
window.canReload = () => STATE === 'title';   // 物語の途中では、更新があっても読みこみ直さない
function showTitle() {
  STATE = 'title'; G = null;
  $('#ending').hidden = true; $('#panel').hidden = true; $('#title').hidden = false; $('#bNote').hidden = true;
  cls(); show([]); drawDeco('snow'); setWeather('snow'); scene('title', ''); bgm('none'); ambient('none');
  const r = rec();
  $('#recLine').textContent = r.played ? `解決した事件 ${r.true} ／ 遊んだ事件 ${r.played}` : '';
}
function startGame() {
  aInit();
  $('#title').hidden = true; $('#ending').hidden = true; $('#panel').hidden = true;
  A.ambKind = A.bgmKind = '';   // 音をつくり直す
  play(10000 + Math.floor(Math.random() * 90000));
}
$('#bStart').onclick = startGame;
$('#bRec').onclick = () => openPanel(recHTML());
$('#bAgain').onclick = () => { if (endWait) endWait(); startGame(); };
$('#bToTitle').onclick = () => { if (endWait) endWait(); showTitle(); };
$('#bTruth').onclick = () => openPanel(truthHTML());
$('#bNote').onclick = e => { e.stopPropagation(); if (G && G.investigating) openNote(); };
$('#bSkip').onclick = e => { e.stopPropagation(); skip = !skip; $('#bSkip').classList.toggle('on', skip); if (skip) onTap(); };
$('#bSnd').onclick = e => { e.stopPropagation(); aInit(); setSound(!A.on); };
setSound(A.on);
showTitle();
</script>

<script>
if('serviceWorker' in navigator){addEventListener('load',()=>{
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{document.addEventListener('visibilitychange',()=>{if(!document.hidden)r.update().catch(()=>{})})}).catch(()=>{});
  /* 新しい版に入れかわったら、安全なときに1回だけ読みこみ直す。
     ゲームの途中などで読みこみ直したくないときは、アプリ側で window.canReload=()=>false を返すようにする */
  let had=!!navigator.serviceWorker.controller,want=false;const go=()=>{if(want&&(!window.canReload||window.canReload()))location.reload()};
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had){want=true;go()}});setInterval(go,3000)})}
</script>
