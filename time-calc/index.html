<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#020617">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="時間差計算">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>時間差計算</title>
<style>
  :root { color-scheme: dark; --bg:#020617; --card:#020818; --line:#3a4459; --field:#1f293a; --text:#f8fafc; --muted:#94a3b8; --accent:#24b081; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); color:var(--text); -webkit-text-size-adjust:100%; }
  body { min-height:100vh; font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; display:flex; justify-content:center; }
  main { width:min(100%,480px); padding:calc(24px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom)); }
  h1 { margin:8px 0 6px; font-size:1.55rem; font-weight:800; letter-spacing:.02em; }
  .sub { margin:0 0 24px; color:var(--muted); font-size:.95rem; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:24px; padding:22px; box-shadow:0 0 40px #0006; }
  label { display:block; color:var(--muted); font-size:.95rem; margin:0 0 10px; }
  .field { margin-bottom:22px; }
  input[type=time] { appearance:none; -webkit-appearance:none; display:block; width:100%; background:var(--field); color:var(--text); border:1px solid var(--line); border-radius:16px; padding:16px 26px; font:700 2.1rem/1.2 system-ui,-apple-system,sans-serif; min-height:96px; font-variant-numeric:tabular-nums; text-align:left; }
  input[type=time]:focus { outline:2px solid var(--accent); outline-offset:2px; }
  input[type=time]::-webkit-date-and-time-value { text-align:left; }
  input[type=time]::-webkit-calendar-picker-indicator { filter:invert(1); opacity:.5; }
  .result { text-align:center; margin:4px 0 20px; padding:26px 10px; border-radius:20px; background:transparent; border:1px solid var(--line); }
  .result-label { color:var(--muted); font-size:.95rem; margin-bottom:6px; }
  #result { font-size:clamp(2rem,10vw,3rem); font-weight:800; line-height:1.25; color:var(--accent); font-variant-numeric:tabular-nums; }
  #total { color:var(--muted); font-size:.95rem; margin-top:8px; min-height:1.2em; }
  .buttons { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  button { border:0; border-radius:14px; min-height:54px; padding:10px 6px; white-space:nowrap; font-size:1rem; font-weight:700; cursor:pointer; font-family:inherit; }
  button:active { transform:scale(.98); }
  .clear { color:var(--text); background:var(--field); border:1px solid var(--line); }
  .now { color:#03251a; background:var(--accent); }
  .hint { margin:16px 3px 0; color:var(--muted); font-size:.8rem; line-height:1.6; }
  @media (max-width:360px) { main { padding-left:12px; padding-right:12px; } .card { padding:15px; } input[type=time] { font-size:1.8rem; padding:14px 18px; } }
</style>
</head>
<body>
<main>
  <h1>時間差計算</h1>
  <p class="sub">時刻を入れるだけ。すぐに計算。</p>
  <section class="card" aria-label="時間差計算">
    <div class="field">
      <label for="start">開始時刻</label>
      <input id="start" type="time" value="14:23" step="60">
    </div>
    <div class="field">
      <label for="end">終了時刻</label>
      <input id="end" type="time" value="17:09" step="60">
    </div>
    <div class="result" aria-live="polite">
      <div class="result-label">時間差</div>
      <div id="result">2時間46分</div>
      <div id="total">合計 166 分</div>
    </div>
    <div class="buttons">
      <button class="now" id="setNow" type="button">終了を現在時刻に</button>
      <button class="clear" id="reset" type="button">リセット</button>
    </div>
  </section>
  <p class="hint">終了時刻が開始時刻より早い場合は、翌日の時刻として計算します。入れた時刻はこの端末に残り、次に開いたときもそのまま。通信は行いません。</p>
</main>
<script>
const start = document.getElementById('start');
const end = document.getElementById('end');
const result = document.getElementById('result');
const total = document.getElementById('total');
const KEY = 'time-calc:last';
try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s) { start.value = s.start || ''; end.value = s.end || ''; } } catch (e) {}
function minutesOf(value) {
  if (!value) return null;
  const [h, m] = value.split(':').map(Number);
  return h * 60 + m;
}
function calculate() {
  try { localStorage.setItem(KEY, JSON.stringify({ start: start.value, end: end.value })); } catch (e) {}
  const a = minutesOf(start.value), b = minutesOf(end.value);
  if (a === null || b === null) {
    result.textContent = '時刻を入力';
    total.textContent = '';
    return;
  }
  let diff = b - a;
  const nextDay = diff < 0;
  if (nextDay) diff += 24 * 60;
  const hours = Math.floor(diff / 60), mins = diff % 60;
  result.textContent = `${hours}時間${mins}分`;
  total.textContent = `合計 ${diff} 分` + (nextDay ? '（翌日）' : '');
}
start.addEventListener('input', calculate);
end.addEventListener('input', calculate);
start.addEventListener('change', calculate);
end.addEventListener('change', calculate);
document.getElementById('setNow').addEventListener('click', () => {
  const d = new Date();
  end.value = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  calculate();
});
document.getElementById('reset').addEventListener('click', () => {
  start.value = '';
  end.value = '';
  calculate();
});
calculate();
// 時刻を選んでいる途中は、新しい版への読みこみ直しを待つ
window.canReload = () => !(document.activeElement && document.activeElement.tagName === 'INPUT');
</script>
<script>
if('serviceWorker' in navigator){addEventListener('load',()=>{
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{document.addEventListener('visibilitychange',()=>{if(!document.hidden)r.update().catch(()=>{})})}).catch(()=>{});
  /* 新しい版に入れかわったら、安全なときに1回だけ読みこみ直す。
     ゲームの途中などで読みこみ直したくないときは、アプリ側で window.canReload=()=>false を返すようにする */
  let had=!!navigator.serviceWorker.controller,want=false;const go=()=>{if(want&&(!window.canReload||window.canReload()))location.reload()};
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had){want=true;go()}});setInterval(go,3000)})}
</script>
</body>
</html>
